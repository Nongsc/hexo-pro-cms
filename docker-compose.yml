# 本地开发用的 PostgreSQL（Neon/Supabase/Vercel Postgres 用户可跳过）
services:
  postgres:
    image: postgres:16-alpine
    container_name: hexo-pro-cms-db
    environment:
      POSTGRES_USER: hexo
      POSTGRES_PASSWORD: hexo
      POSTGRES_DB: hexo_pro_cms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
